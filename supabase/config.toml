project_id = "conpat-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# A07/A06: Registro abierto deshabilitado — solo el admin crea usuarios en producción
# En producción (Supabase cloud) deshabilitar también desde el dashboard:
# Authentication → Providers → Email → Disable "Allow new users to sign up"
enable_signup = false
enable_anonymous_sign_ins = false
# A07: Mínimo 10 caracteres (NIST 800-63b recomienda longitud sobre complejidad)
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
